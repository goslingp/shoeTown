{% extends "base.html" %}

{% block content %}

<h2>Our Shoes</h2>

<div class="products">

{% for product in products %}

<div class="card">

    <img src="{{ url_for(
        'static',
        filename='images/' + product.image
    ) }}">

    <h3>{{ product.name }}</h3>

    <p>{{ product.brand }}</p>

    <p>€{{ product.price }}</p>

    <a href="{{ url_for(
        'product',
        product_id=product.id
    ) }}">
        View
    </a>

</div>

{% endfor %}

</div>

{% endblock %}
