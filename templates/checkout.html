{% extends "base.html" %}

{% block content %}

<h2>Checkout</h2>

<form method="post">

    <input
        type="text"
        name="name"
        placeholder="Customer Name"
        required>

    <br><br>

    <input
        type="email"
        name="email"
        placeholder="Email"
        required>

    <br><br>

    <button type="submit">
        Place Order
    </button>

</form>

{% endblock %}
