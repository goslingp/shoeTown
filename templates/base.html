<!DOCTYPE html>
<html>
<head>
    <title>Shoe Town</title>
    <link rel="stylesheet"
          href="{{ url_for('static',
          filename='css/style.css') }}">
</head>
<body>

<nav>

<a href="{{ url_for('home') }}">
Home
</a>

{% if session.user %}

<a href="{{ url_for('profile') }}">
Profile
</a>

<a href="{{ url_for('logout') }}">
Logout
</a>

{% else %}

<a href="{{ url_for('register') }}">
Register
</a>

<a href="{{ url_for('login') }}">
Login
</a>

{% endif %}

<a href="{{ url_for('cart') }}">
Cart
</a>

</nav>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
